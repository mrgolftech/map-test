name: Bootstrap frontend lockfile

on:
  push:
    branches: [feature/phase-0-foundation]
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-0-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: lock frontend dependencies"
          git push origin HEAD:feature/phase-0-foundation
