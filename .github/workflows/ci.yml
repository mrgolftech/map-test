name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m compileall -q app
      - run: pytest
      - run: mkdir -p .test-data && DATABASE_URL=sqlite:///./.test-data/migration.db alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t map-test:ci .
      - run: docker run -d --rm --name map-test-ci -p 8000:8000 map-test:ci
      - run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
              curl --fail --silent "http://127.0.0.1:8000/api/v1/analyses?page=1&page_size=1"
              exit 0
            fi
            sleep 1
          done
          docker logs map-test-ci
          exit 1
      - if: always()
        run: docker stop map-test-ci || true
